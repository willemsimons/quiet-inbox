name: Inbox
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    from: 1.7.6
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Inbox:
    type: application
    platform: iOS
    sources: [Inbox]
    dependencies:
      - package: AppAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.inbox
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Inbox/Info.plist
      properties:
        CFBundleDisplayName: Inbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        GoogleRedirectScheme: $(GOOGLE_REVERSED_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: ['$(GOOGLE_REVERSED_CLIENT_ID)']
  InboxTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [InboxTests]
    dependencies:
      - target: Inbox
  InboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InboxUITests]
    dependencies:
      - target: Inbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Inbox
schemes:
  Inbox:
    build:
      targets:
        Inbox: all
    test:
      targets: [InboxTests, InboxUITests]
    archive:
      config: Release
