<title>Inbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one pane of blue glass over a wallpaper, like Catalog's Plasma theme.
   Categories and today on the left, one list ordered by importance, the open email on the right.
   Deliberately single-theme: the glass is the identity. Type is the terminal's SF Mono Italic. */
:root {
  color-scheme: dark;
  --ink: #e6efff; --strong: #ffffff; --blue: #63d0ff; --lilac: #c9b0ee; --amber: #ffb86c;
  --dim: #94aacf; --chip: rgba(255,184,108,.13); --gold: #ffd166; --danger: #ff8a7a;
  /* Circular for everything: Regular and Medium for text, Bold for headers. */
  --mono: "CircularXX TT", "Circular Std", Circular, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --head: "CircularXX TT", "Circular Std", Circular, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font: normal 500 13.5px/1.5 var(--mono); -webkit-font-smoothing: antialiased; overflow: hidden;
  background:
    radial-gradient(55% 45% at 84% 8%, #9fb3d2 0, transparent 72%),
    radial-gradient(50% 60% at 6% 92%, #3d5689 0, transparent 72%),
    linear-gradient(118deg, transparent 38%, rgba(255,255,255,.13) 49%, transparent 60%),
    linear-gradient(156deg, #6480ae 0, #385086 52%, #22325d 100%); }
button, textarea { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
button { cursor: pointer; }
i { font-style: normal; }
:focus-visible { outline: 1px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
code { font: inherit; color: var(--amber); background: var(--chip); padding: 0 4px; border-radius: 4px; }

html.skybg body { background: var(--sky); }
html.skybg .glass { background: linear-gradient(122deg, rgba(150,190,255,.08) 0, transparent 34%, rgba(150,190,255,.06) 58%, transparent 80%), rgba(14,22,42,var(--glassA, .5)); }
.window { position: relative; height: 100%; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.glass { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  background:
    linear-gradient(122deg, rgba(150,190,255,.10) 0, transparent 34%, rgba(150,190,255,.08) 58%, transparent 80%),
    rgba(24,35,62,.60);
  -webkit-backdrop-filter: blur(30px) saturate(110%); backdrop-filter: blur(30px) saturate(110%); }

.tabs { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; min-width: 0; }
.navright { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
.navright .join { font: inherit; font-size: 12px; white-space: nowrap; }
.iconbtn { display: grid; place-items: center; padding: 7px 9px; }
.iconbtn svg { width: 14px; height: 14px; }
.iconbtn.on { color: var(--blue); }
.calbtn { display: flex; align-items: center; gap: 7px; margin-left: auto; flex: none; }
.calbtn svg { width: 14px; height: 14px; }
.seg { display: inline-flex; flex: none; gap: 2px; padding: 3px; }
.tab { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.tab svg { width: 15px; height: 15px; }
.tab .nm { display: none; }
.tab.on .nm { display: inline; }
.tab.on { color: var(--strong); }
.tab i { opacity: .72; font-variant-numeric: tabular-nums; font-size: 12px; }

.panes { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); min-height: 0; }
/* Categories scroll inside the bar and fade out at its ends, so nothing is cut off with a hard edge. */
.catbar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-inline: 8px;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 10px, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(to right, transparent, #000 10px, #000 calc(100% - 26px), transparent); }
.catbar::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
.glass.cal .catbar { visibility: hidden; }
.cat { display: inline-flex; flex: none; gap: 7px; align-items: center; padding: 6px 11px; border-radius: 999px; color: var(--dim); white-space: nowrap; }
.cat.on { color: var(--strong); }
.cat u { width: 8px; height: 8px; border-radius: 50%; background: oklch(76% .12 var(--h)); box-shadow: 0 0 8px oklch(76% .12 var(--h) / .7); }
.cat.none u { background: var(--dim); box-shadow: none; }
.cat.star u { width: auto; height: auto; margin-left: -2px; background: none; box-shadow: none; color: var(--gold); font-size: 15px; line-height: 1; font-style: normal; text-decoration: none; }
.cat i { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .8; }

/* The list scrolls under a soft top and bottom edge. */
.list { position: relative; isolation: isolate; overflow-y: auto; scrollbar-width: none; padding-block: 18px 70px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 48px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 48px), transparent 100%); }

/* Each cell's color lives on a layer taller than the row, faded on all four sides.
   Neighbours overlap, so hues run into each other and into the glass with no edge anywhere. */
.row { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: start; }
.row::before { content: ""; position: absolute; z-index: -1; inset: -26px 0;
  background: oklch(84% .03 245); opacity: .17; transition: opacity .16s, background .16s;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 34%, #000 66%, transparent), linear-gradient(to right, transparent, #000 13%, #000 80%, transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 34%, #000 66%, transparent), linear-gradient(to right, transparent, #000 13%, #000 80%, transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
/* Unread mail glows softly. The topic color only shows while you hover. */
.row:hover::before { background: oklch(62% var(--c, .1) var(--h, 250)); opacity: .5; }
.row.sel::before, .row.picked::before { opacity: .3; }
.row.sel:hover::before, .row.picked:hover::before { opacity: .62; }
.dot { position: absolute; left: 10px; top: 27px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px rgba(99,208,255,.8); }
.pick { position: relative; width: 38px; height: 38px; margin: 12px 0 0 26px; border-radius: 50%; }
.box { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; font-style: normal; color: transparent; opacity: 0; transition: opacity .12s;
  background: rgba(9,18,46,.3); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.62); }
.pick:hover .box, .pick:focus-visible .box, .selecting .box, .row.picked .box { opacity: 1; }
.row.picked .box { background: #fff; color: #16223c; box-shadow: none; }
.hit { display: block; padding: 12px 8px 12px 13px; text-align: left; min-width: 0; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-style: normal; color: #fff;
  background: radial-gradient(circle at 32% 28%, oklch(78% .13 var(--h, 250)), oklch(46% .13 var(--h, 250))); }
.top { display: flex; justify-content: space-between; gap: 14px; }
.from { color: var(--strong); font: normal 700 14px/1.45 var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.when { color: var(--dim); font-size: 12px; white-space: nowrap; }
.subj { color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snip { display: block; color: var(--ink); opacity: .84; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Hovering an email previews it in the reading pane; clicking opens it. */
.rpreview { position: absolute; inset: 12px 24px 16px 10px; display: flex; flex-direction: column; min-height: 0; }
.reader.previewing > :not(.rpreview) { visibility: hidden; }
.reader.previewing .rhead small::after { content: " · Preview, click to open"; color: var(--blue); }
.tools { display: flex; align-self: center; gap: 2px; margin-right: 12px; }
.done, .fav { width: 30px; height: 30px; border-radius: 50%; color: var(--dim); opacity: 0; font-style: normal; transition: opacity .16s; }
.done { position: absolute; right: 52px; top: 50%; translate: 0 -50%; width: auto; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12px; color: var(--strong); background: rgba(13,26,62,.9); white-space: nowrap; }
.row:hover .done, .done:focus-visible, .row:hover .fav, .row.sel .fav, .fav:focus-visible { opacity: 1; }
.fav { width: 34px; height: 34px; font-size: 21px; line-height: 1; }
.fav.on { opacity: 1; color: var(--gold); }
.bigstar { font-size: 15px; line-height: 1; font-style: normal; }
/* Upcoming meetings: small separate cards above the mail, unlike the flowing rows below. */
.meets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; padding: 0 16px 14px 26px; }
.meetcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 10px 9px 14px; border-radius: 14px; background: rgba(170,200,255,.12); box-shadow: inset 0 .5px 0 rgba(255,255,255,.24); transition: background .16s; }
.meetcard:hover { background: rgba(170,200,255,.18); }
.mhit { display: block; min-width: 0; text-align: left; }
.mhit b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: normal 700 13.5px/1.3 var(--head); color: var(--strong); }
.mhit small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 1.4; color: var(--blue); }
.mhit i { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; line-height: 1.4; color: var(--dim); }
.meetcard .join { padding: 5px 14px; }
.join { padding: 6px 15px; border-radius: 999px; font-size: 12px; color: #16223c; background: rgba(255,255,255,.92); text-decoration: none; }
.join:hover { background: #fff; }
/* Calendar: an hourly week beside the event editor. No grid lines; events are feathered like mail cells. */
.calwrap { grid-column: 1 / -1; grid-row: 1 / -1; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.calview { min-height: 0; min-width: 0; overflow: auto; scrollbar-width: none; padding: 0 16px 24px; }
.chead { position: sticky; left: 0; display: flex; align-items: center; gap: 12px; padding: 10px 6px 12px; }
.cnav { display: flex; align-items: center; gap: 6px; }
.cnav .act { padding: 6px 16px; font-size: 15px; min-height: 38px; }
.calview .chead:has(.cnav) { padding-block: 7px 8px; }
.cnav [data-week] { min-width: 42px; padding-inline: 0; font-size: 22px; line-height: 1; }
.new { margin-left: auto; white-space: nowrap; font: inherit; font-size: 12px; }
.dgrid { isolation: isolate; display: grid; grid-template-columns: 46px repeat(7, minmax(84px, 1fr)); }
.dh { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 4px 7px 14px; font: normal 700 14px/1.4 var(--head); color: var(--dim); }
.dh.today { color: var(--strong); }
.adchip { display: block; width: 100%; text-align: left; padding: 2px 8px; border-radius: 999px; font: normal 500 12px var(--mono); color: var(--ink); background: oklch(62% .1 var(--h) / .34); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gutter { position: relative; height: var(--grid-h); }
.hl { position: absolute; right: 8px; font-size: 11px; color: var(--dim); translate: 0 -50%; white-space: nowrap; }
.hl.sub { font-size: 10px; opacity: .6; }
.cev.thin { padding: 0; border-radius: 3px; }
.calzoom { display: inline-flex; gap: 6px; margin-inline: 6px; }
.calzoom .act { min-width: 42px; padding-inline: 0; font-size: 20px; line-height: 1; }
.dcol { position: relative; height: var(--grid-h); min-width: 0; -webkit-user-select: none; user-select: none; cursor: crosshair; touch-action: pan-x pan-y; }
.cev { position: absolute; display: block; min-width: 0; padding: 4px 7px; text-align: left; font-size: 11.5px; line-height: 1.3; cursor: pointer; }
.cev > * { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cev::before { content: ""; position: absolute; z-index: -1; inset: -20px -14px; background: oklch(62% .1 var(--h)); opacity: .46; transition: opacity .16s;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 34px, #000 calc(100% - 34px), transparent), linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 34px, #000 calc(100% - 34px), transparent), linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.cev:hover::before, .cev.on::before { opacity: .78; }
.cev b { font: normal 700 12.5px/1.3 var(--head); color: var(--strong); }
.cev time, .cev small { color: var(--dim); font-size: 11px; }
.cev.past { opacity: .42; }
.cev.past::before { background: oklch(62% 0 0); }
.nowline { position: absolute; left: 0; right: 0; z-index: 2; height: 2px; pointer-events: none; background: linear-gradient(to right, var(--amber), transparent); }
.nowline::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }

.editor { width: 400px; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 11px; padding: 12px 22px 18px 16px; }
.ftitle { width: 100%; border: 0; outline: 0; background: none; color: var(--strong); font: normal 700 20px/1.3 var(--head); }
.ftitle::placeholder { color: var(--dim); }
.frow { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; align-items: start; }
.frow > span:first-child { color: var(--dim); font-size: 12px; padding-top: 6px; }
.fstack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.fi { min-width: 0; width: 100%; border: 0; outline: 0; border-radius: 10px; padding: 6px 10px; color: var(--ink); background: rgba(170,200,255,.11); font: inherit; font-size: 12.5px; color-scheme: dark; }
.fline .fi { width: auto; flex: 1; }
.fi:focus { box-shadow: inset 0 0 0 1px rgba(99,208,255,.55); }
.fi::placeholder { color: var(--dim); }
textarea.fi { height: 66px; padding-top: 7px; }
.fcheck { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink); }
.link { color: var(--blue); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gchip { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.gchip small { color: var(--dim); font-size: 11.5px; }
.gchip button { color: var(--dim); }
.act.on { color: #16223c; background: rgba(255,255,255,.92); }
.efoot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; }
.efoot .join { margin-left: auto; }
.efoot .join, .efoot .act { font: inherit; font-size: 12px; white-space: nowrap; }
.toast { position: absolute; z-index: 7; left: 50%; bottom: 18px; translate: -50% 0; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 24px); padding: 7px 15px; border-radius: 999px; font-size: 12px; color: var(--strong);
  background: rgba(13,26,62,.92); box-shadow: inset 0 .5px 0 rgba(255,255,255,.22), 0 6px 20px rgba(4,12,44,.45); }
.toast[hidden] { display: none; }
.composer { position: absolute; z-index: 6; right: 18px; bottom: 18px; width: min(500px, calc(100% - 24px)); max-height: calc(100% - 88px); overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 20px;
  background: rgba(13,26,62,.95); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: inset 0 .5px 0 rgba(255,255,255,.22), 0 12px 40px rgba(4,12,44,.55); }
.composer[hidden] { display: none; }
.chd { display: flex; align-items: center; justify-content: space-between; }
.chd h1 { font-size: 15px; }
.chd button { color: var(--dim); }
.composer .cclink { align-self: flex-end; color: var(--blue); font-size: 12px; }
.composer textarea.fi { height: 190px; resize: vertical; }
.cfoot { display: flex; align-items: center; justify-content: space-between; }
.cfoot .join { font: inherit; font-size: 12px; }
.settings { grid-column: 1 / -1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 22px 24px 40px; display: flex; flex-direction: column; align-items: center; }
.setin { width: min(620px, 100%); display: flex; flex-direction: column; gap: 22px; }
.setin h1 { font-size: 22px; }
.setin > p { margin: -14px 0 0; color: var(--dim); }
.ws { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.wsicon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--strong); background: rgba(170,200,255,.16); }
.wsicon svg { width: 21px; height: 21px; }
.wsbody { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.wsbody small { color: var(--dim); font-size: 12px; }
.pick-icons { display: flex; flex-wrap: wrap; gap: 3px; }
.pick-icons button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--dim); }
.pick-icons button:hover { color: var(--strong); background: rgba(170,200,255,.13); }
.pick-icons button.on { color: var(--strong); background: rgba(170,200,255,.22); box-shadow: inset 0 .5px 0 rgba(255,255,255,.3); }
.pick-icons svg { width: 16px; height: 16px; }
.toast button { color: var(--blue); white-space: nowrap; }
.glass.cal .status, .glass.cal .bulk { display: none; }
.done:hover { color: var(--strong); }
/* Read mail: white text at 35%, picture at 50%, gray cell. */
/* Read mail sits straight on the background: no glow under it. */
.row.read::before { background: oklch(62% 0 0); opacity: 0; }
/* A glow fades out at its own edge when the next row is read or a meeting, so only unread neighbors blend. */
.row:not(.read):has(+ .row.read)::before, .row:not(.read):has(+ .wait)::before { bottom: 0; }
.row.read + .row:not(.read)::before, .meets + .row:not(.read)::before, .wait + .row:not(.read)::before { top: 0; }
.row.read.sel::before { opacity: 0; }
.row.read.picked::before { background: oklch(84% .03 245); opacity: .2; }
.row.read:hover::before { background: oklch(62% var(--c, .1) var(--h, 250)); opacity: .42; }
.row.read .from, .row.read .when, .row.read .subj, .row.read .snip { color: rgba(255,255,255,.35); opacity: 1; }
.row.read code { color: inherit; background: none; padding: 0; }
.row.read .av { opacity: .5; }
@media (hover: none) { .fav { opacity: .7; } .done, .hoveracts { display: none; } }
.wait { display: flex; justify-content: space-between; gap: 16px; padding: 16px 28px 16px 26px; color: var(--dim); }
.wait { align-items: center; }
.wait button { color: var(--strong); white-space: nowrap; padding: 5px 12px; font-size: 12px; }

.reader { position: relative; display: flex; flex-direction: column; min-height: 0; padding: 12px 24px 16px 10px; }
.reader::before { content: ""; position: absolute; z-index: -1; inset: -40px -40px auto -60px; height: 280px; opacity: .3;
  background: radial-gradient(closest-side, oklch(78% .03 245), transparent); }
.back { display: none; color: var(--blue); margin-bottom: 12px; align-self: flex-start; }
.rscroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 14px; padding-block: 8px 12px; }
.rhead { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 13px; align-items: center; }
.rhead .av { width: 44px; height: 44px; }
.rhead small { display: block; font-size: 12px; color: var(--dim); }
h1 { font: normal 700 17px/1.3 var(--head); color: var(--strong); margin: 0; text-wrap: balance; }
.why { color: var(--lilac); margin: 0; padding-left: 12px; position: relative; }
.why::before { content: ">"; position: absolute; left: 0; color: var(--dim); }
.body { margin: 0; white-space: pre-line; line-height: 1.62; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.act { padding: 6px 12px; font-size: 12px; }
.act:disabled { opacity: .55; cursor: default; }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 8px 8px 8px 16px; margin-top: 10px; }
textarea { width: 100%; resize: none; height: 60px; line-height: 1.45; outline: 0; padding-top: 4px; }
textarea::placeholder { color: var(--dim); }
.send { width: 32px; height: 32px; color: var(--strong); font-style: normal; }

.zero { grid-column: 1 / -1; display: grid; place-content: center; gap: 12px; text-align: center; color: var(--dim); }
.zero h1 { font-size: 22px; }
.glass.has-bulk .status { display: none; }
.status { position: absolute; left: calc((100% - 430px) / 2); translate: -50% 0; bottom: 16px; z-index: 3; white-space: nowrap; display: flex; gap: 10px; padding: 6px 12px; font-size: 12px; color: var(--ink); }
.status button { color: var(--blue); }

/* Quiet glass: a soft fill with one faint lit edge. No rim and no shadow, so the controls stay in the background. */
.tab.on, .cat.on, .act, .send, .status, .back, .wait button, .fav:hover {
  border-radius: 999px; background: rgba(170,200,255,.13); box-shadow: inset 0 .5px 0 rgba(255,255,255,.22); }
.compose { border-radius: 24px; background: rgba(9,18,46,.40); box-shadow: inset 0 0 0 .5px rgba(200,222,255,.14); }
.bulk { position: absolute; z-index: 5; left: 0; right: 430px; bottom: 18px; display: flex; justify-content: center; pointer-events: none; }
.bar { pointer-events: auto; display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 15px; border-radius: 999px; font-size: 12px; color: var(--strong);
  background: rgba(13,26,62,.88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 .5px 0 rgba(255,255,255,.22), 0 6px 20px rgba(4,12,44,.45); }
.bar span { margin-right: 8px; white-space: nowrap; }
.bar button { padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.bar button:hover { background: rgba(170,200,255,.13); }
.bar .del { color: var(--danger); }

<script>
/* The background is the sky's gradient at this moment of the real day: where the sun is over your city sets the colors
   (night, dawn, daylight, golden hour, dusk), with the sun's glow low on the side it's on. Plain CSS gradients, updated once a minute. */
(() => {
  const P = { // zenith, horizon, sun glow
    night:  [[0.015, 0.025, 0.08], [0.07, 0.1, 0.19], [0.32, 0.4, 0.58]],
    late:   [[0.05, 0.06, 0.18], [0.3, 0.2, 0.3], [0.6, 0.4, 0.45]],
    dawn:   [[0.28, 0.38, 0.66], [0.98, 0.76, 0.62], [1, 0.8, 0.6]],
    sunny:  [[0.08, 0.32, 0.78], [0.48, 0.7, 0.94], [1, 0.97, 0.86]],
    golden: [[0.2, 0.34, 0.62], [0.98, 0.72, 0.46], [1, 0.76, 0.42]],
    dusk:   [[0.14, 0.16, 0.4], [0.9, 0.5, 0.4], [1, 0.58, 0.4]],
  };
  // Sun height (degrees) to palette, separately for morning and evening.
  const MORNING = [[-90, "night"], [-14, "night"], [-7, "late"], [-2, "dawn"], [7, "dawn"], [20, "sunny"], [90, "sunny"]];
  const EVENING = [[-90, "night"], [-14, "night"], [-8, "late"], [-3, "dusk"], [3, "golden"], [12, "golden"], [24, "sunny"], [90, "sunny"]];
  const rad = Math.PI / 180;
  // Where the sky is: your city from settings (London until you set one). skyPlace() can move it for previews.
  const homeCity = () => { const c = window.REAL_DATA?.city; return c && isFinite(c.lat) && isFinite(c.lon) ? c : {name: "London", lat: 51.51, lon: -0.13}; };
  let place = {lat: homeCity().lat, lon: homeCity().lon, utc: null};

  function sun(date) {
    const LAT = place.lat, LON = place.lon;
    const offMin = place.utc == null ? date.getTimezoneOffset() : -place.utc * 60;
    const n = (date - new Date(date.getFullYear(), 0, 0)) / 864e5, g = 2 * Math.PI / 365 * (n - 1);
    const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g);
    const eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    // true solar time in minutes = clock + equation of time + 4·longitude − 60·UTC offset
    const tst = date.getHours() * 60 + date.getMinutes() + eot + 4 * LON + offMin;
    const ha = (tst / 4 - 180) * rad;
    const alt = Math.asin(Math.sin(LAT * rad) * Math.sin(decl) + Math.cos(LAT * rad) * Math.cos(decl) * Math.cos(ha)) / rad;
    return {alt, ha: ha / rad};
  }
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  function palette(s) {
    const track = s.ha < 0 ? MORNING : EVENING;
    let i = 0;
    while (i < track.length - 2 && s.alt > track[i + 1][0]) i++;
    const [a0, n0] = track[i], [a1, n1] = track[i + 1];
    const t = Math.min(1, Math.max(0, (s.alt - a0) / (a1 - a0))), e = t * t * (3 - 2 * t);
    return P[n0].map((v, k) => mix(v, P[n1][k], e));
  }
  const css = (c, a = 1) => `rgba(${c.map(v => Math.round(Math.min(1, v) * 255)).join(",")},${a})`;

  let override = null, pinned = null; // hours: the settings preview, and ?sky=HH:MM for a fixed time
  try { const q = new URLSearchParams(location.search).get("sky"); if (q) { const [hh, mm] = q.split(":"); pinned = +hh + (+mm || 0) / 60; } } catch {}
  function at() {
    // "local" clock fields: this Mac's, or the chosen place's
    const d = place.utc == null ? new Date() : new Date(Date.now() + (new Date().getTimezoneOffset() + place.utc * 60) * 60000);
    const fixed = override ?? pinned;
    if (fixed != null) d.setHours(Math.floor(fixed), Math.round((fixed % 1) * 60), 0, 0);
    return d;
  }
  const root = document.documentElement;
  function paint() {
    let classic = root.dataset.bg === "classic";
    try { classic = classic || localStorage.getItem("inbox-background") === "classic"; } catch {}
    if (classic) { root.style.removeProperty("--sky"); root.classList.remove("skybg"); return; }
    const s = sun(at()), [zen, hor, glow] = palette(s);
    const mid = mix(hor, zen, 0.55);
    const up = Math.max(0, Math.min(1, (s.alt + 6) / 12)); // how much of the sun's glow shows
    const x = Math.round(50 + Math.max(-1, Math.min(1, s.ha / 110)) * 40), y = Math.round(100 - Math.max(0, Math.min(1, (s.alt + 4) / 70)) * 85);
    root.style.setProperty("--sky",
      `radial-gradient(60% 55% at ${x}% ${y}%, ${css(glow, 0.55 * up)} 0, ${css(glow, 0)} 70%),` +
      `radial-gradient(120% 45% at ${x}% 100%, ${css(hor, 0.9)} 0, ${css(hor, 0)} 75%),` +
      `linear-gradient(to top, ${css(hor)} 0, ${css(mid)} 45%, ${css(zen)} 100%)`);
    // Brighter skies get a deeper glass so white text stays easy to read.
    const lum = 0.2126 * hor[0] + 0.7152 * hor[1] + 0.0722 * hor[2];
    root.style.setProperty("--glassA", (0.34 + 0.3 * lum).toFixed(3));
    root.classList.add("skybg");
  }
  window.skyPreview = hours => { if (hours === override) return; override = hours; paint(); };
  window.skyRestart = paint;
  window.skyPlace = (lat, lon, utc) => { place = lat == null ? {lat: homeCity().lat, lon: homeCity().lon, utc: null} : {lat, lon, utc}; paint(); };
  window.skyClock = () => at();
  window.skySun = () => sun(at());
  paint();
  setInterval(paint, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) paint(); });
})();
</script>

/* The Herdr style's sky: the hue turns a full circle every HERDR_LAP ms, from the clock, so it carries on where it was
   after a reload. Every few seconds it sets the next hue and CSS glides there (the sky's filter, the accents' colors),
   so the browser only restyles once per step. The angle is never wrapped to 0–360, so a glide never spins backwards. */
const HERDR_LAP = 6 * 60 * 1000, HERDR_STEP = 4000;
function herdrSky() {
  let sky = document.getElementById("herdrsky");
  if (!sky) { sky = document.createElement("div"); sky.id = "herdrsky"; document.body.prepend(sky); }
  let last = 0;
  const turn = (t, glide) => {
    glide = glide && Date.now() - last < 2 * HERDR_STEP; // after a pause (hidden, other style), jump instead of spinning to catch up
    last = Date.now();
    const deg = ((t % (HERDR_LAP * 1000)) / HERDR_LAP * 360).toFixed(2) + "deg";
    sky.style.transition = glide ? `filter ${HERDR_STEP}ms linear` : "none";
    sky.style.setProperty("--hrot", deg);
    document.documentElement.style.setProperty("--hshift", deg);
  };
  turn(Date.now(), false);
  setInterval(() => { if (styleLook === "herdr" && !document.hidden) turn(Date.now() + HERDR_STEP, true); }, HERDR_STEP);
}

/* Press and drag in a day column to block out a new event; a plain click makes a one-hour event. */
const snapAt = (col, clientY) => {
  const min = GRID_START + (clientY - col.getBoundingClientRect().top) / HOUR * 60;
  return Math.min(GRID_END - 15, Math.max(GRID_START, Math.round(min / 15) * 15));
};
document.addEventListener("pointerdown", e => {
  const col = e.target.closest?.(".dcol");
  if (!col || e.button || e.target.closest(".cev")) return;
  drag = {col: +col.dataset.day, from: snapAt(col, e.clientY), moved: false};
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const col = document.querySelector(`.dcol[data-day="${drag.col}"]`), at = snapAt(col, e.clientY);
  if (at === drag.from) return;
  drag.moved = true;
  const s = Math.min(at, drag.from), m = Math.max(15, Math.abs(at - drag.from));
  if (!draft?.isNew) { newDraft(drag.col, s, m); render(); } else { draft.day = drag.col; draft.s = s; draft.m = m; paintWeek(); }
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  if (!drag.moved) newDraft(drag.col, drag.from, 60);
  drag = null; openDraftEditor();
});
document.addEventListener("pointercancel", () => { drag = null; });
document.addEventListener("input", e => {
  const f = e.target.dataset?.f;
  if (!f || !draft) return;
  const value = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (f === "date") { if (value) draft.day = dayOf(value); }
  else if (f === "start") { if (value) draft.s = fromHHMM(value); }
  else if (f === "end") { if (value) draft.m = Math.max(15, fromHHMM(value) - draft.s); }
  else draft[f] = value;
  if (f === "allDay") render(); else paintWeek();
  if (f === "date" && !occursInWeek(draft.day)) { week = Math.floor(draft.day / 7); render(); }
});
const occursInWeek = day => day >= week * 7 && day < (week + 1) * 7;

/* A plain mouse wheel scrolls the meeting cards sideways when they overflow. */

  const row = e.target.closest?.(".meets");
  if (!row || row.scrollWidth <= row.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  const atEnd = e.deltaY > 0 ? row.scrollLeft + row.clientWidth >= row.scrollWidth - 1 : row.scrollLeft <= 0;

    for (const part of [".rhead", ".why", ".acts"]) { const a = oldReader.querySelector(".rscroll > " + part), b = next.querySelector(".rscroll > " + part); if (a && b) a.replaceWith(b); }
  } else
  $("panes").innerHTML = view === "calendar" ? calHTML() : view === "settings" ? settingsHTML() : view === "news" ? newsHTML(list) : body;
  $("newsbtn").innerHTML = `${ICONS.news}<span class="lbl">News</span><i class="newsi lbl" aria-label="${streak.days} day streak">${ICONS.flame}${streak.days}</i>`;
  $("newsbtn").classList.toggle("on", view === "news");
  $("glass").classList.toggle("newsv", view === "news");
  $("setbtn").innerHTML = `${svg(GEAR)}<span class="lbl">Settings</span>`;
  $("setbtn").classList.toggle("on", view === "settings");
  if ($("calview")) {
    fitCalHeader();
    // Opening the calendar starts a little before now (or at 7 AM), not at midnight.
    if (lastView !== "calendar") $("calview").scrollTop = Math.max(0, (Math.min(NOW.min - 90, 7 * 60) - GRID_START) / 60 * HOUR);
    else $("calview").scrollTop = keepCal;
  }
  lastView = view;
  $("glass").classList.toggle("cal", view !== "mail" && view !== "news");
  $("calbtn").innerHTML = `${ICONS.calendar}<span class="lbl">Calendar</span>`;
  $("inboxbtn").innerHTML = `${ICONS.inbox}<span class="lbl">Inbox</span>`;
  $("calbtn").classList.toggle("on", view === "calendar");
  $("inboxbtn").classList.toggle("on", view === "mail");
  if ($("list")) $("list").scrollTop = keep;
  $("status").innerHTML = `<span>Sample mail · ${total ? total + " unread" : "Zero unread"}</span>` + (total ? "" : `<button data-reset>Reset</button>`);
  paintUndo();
  document.querySelectorAll(".list .row.sel").forEach(measureActs);
  if (view !== "settings") window.skyPreview?.(null);
  if (view === "mail" || view === "news") noteHistory(cur);
  paintHistory();
  const picked = mail.filter(m => picks.has(m.id));
  $("glass").classList.toggle("has-bulk", picks.size > 0);
  $("bulk").innerHTML = picks.size ? `<div class="bar" role="toolbar" aria-label="Selected emails"><span>${picks.size} selected</span>
    ${picked.some(m => m.unread) ? `<button data-bulkread>Mark as read</button>` : `<button data-bulkunread>Mark as unread</button>`}
    <button class="del" data-bulkdel>Delete</button><button data-clear aria-label="Clear selection">✕</button></div>` : "";
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if ("gomail" in d) { view = "mail"; cat = "Unread"; draft = null; render(); }
  else if ("gocal" in d) { view = "calendar"; picks.clear(); render(); }
  else if ("gonews" in d) { view = "news"; cat = null; draft = null; peek = false; picks.clear(); sel = shown()[0]?.id ?? null; render(); }
  else if ("hist" in d) goHistory(+d.hist);
  else if ("collapse" in d) {
    // The pointer is still on the sidebar after this click, so hover-open waits until it leaves once.
    $("glass").classList.toggle("collapsed");
    $("glass").classList.remove("sidepeek");
    clearTimeout(sidePeekTimer); peekArmed = false;
  }
  else if ("compose" in d) openComposer();
  else if ("csend" in d) sendComposer();
  else if ("cclose" in d) closeComposer();
  else if ("ccshow" in d) { composing.showCc = true; paintComposer(); $("c-cc").focus(); }
  else if ("settings" in d) { view = "settings"; draft = null; picks.clear(); render(); }
  else if (d.icon) { accountIcons[d.for] = d.icon; saveWorkspaces(); render(); }
  else if (d.style && b.classList.contains("lookopt")) setStyle(d.style);
  else if (d.look) setEmailLook(d.look);
  else if (d.bg && b.classList.contains("lookopt")) setBackground(d.bg);
  else if ("view" in d) toggleView();
  else if (d.week) { week += +d.week; draft = null; render(); }
  else if ("today" in d) { week = 0; draft = null; render(); }
  else if (d.calzoom) calZoomBy(+d.calzoom > 0 ? 1.5 : 1 / 1.5, null, true);
  else if ("new" in d) { newDraft(week === 0 ? NOW.day : week * 7, week === 0 ? 15 * 60 : 10 * 60, 60); openDraftEditor(); }
  else if (d.ev) { const found = events.find(x => x.id === +d.ev); draft = {...found, guests: found.guests.map(g => ({...g}))}; render(); }
  else if ("addmeet" in d) { const code = n => Array.from({length: n}, () => "abcdefghijkmnopqrstuvwxyz"[Math.floor(Math.random() * 25)]).join(""); draft.via = "Google Meet"; draft.code = `${code(3)}-${code(4)}-${code(3)}`; render(); }
  else if ("rmmeet" in d) { draft.via = null; draft.code = null; render(); }
  else if ("copy" in d) { navigator.clipboard?.writeText("https://" + linkText(draft)).then(() => toast("Link copied"), () => toast("Could not copy. Select the link instead.")); }
  else if (d.rmguest) { draft.guests.splice(+d.rmguest, 1); render(); }
  else if (d.rsvp) { draft.rsvp = d.rsvp; render(); }
  else if ("save" in d) saveDraft();
  else if ("cancel" in d) { draft = null; render(); }
  else if ("delev" in d) deleteDraft();
  else if ("evundo" in d) { evUndo?.(); evUndo = null; $("toast").hidden = true; render(); }
  else if (d.acct) { acct = d.acct; picks.clear(); if (view === "settings") view = "mail"; render(); }
  else if (d.orig) showOriginal(+d.orig);
  else if ("closeorig" in d) closeOriginal();
  else if (d.pick) togglePick(+d.pick, e.shiftKey);
  else if (d.star) toggleStar(+d.star);
  else if (d.del) remove([+d.del]);
  else if (d.arch) { const ids = [+d.arch]; advance(ids, () => true); apply(mail.filter(m => ids.includes(m.id)), "archived", true); }
  else if (d.unsub) { const m = mail.find(x => x.id === +d.unsub); if (m && !unsubBusy.has(senderKey(m))) { unsubscribe(m); if (m.unread) markRead([m.id]); } }
  else if (d.spam) { const sm = mail.find(x => x.id === +d.spam); if (sm && canUnsub(sm) && !unsubbed.has(senderKey(sm)) && !unsubBusy.has(senderKey(sm))) unsubscribe(sm); const ids = [+d.spam]; advance(ids, () => true); apply(mail.filter(m => ids.includes(m.id)), "spam", true); }
  else if (d.fwd) forwardEmail(mail.find(m => m.id === +d.fwd));
  else if ("smore" in d) { searchLimit += 100; searchAll(search.trim(), true, searchLimit); }
  else if ("sclear" in d) { search = ""; searchHits = null; searching = ""; clearTimeout(searchTimer); render(); }
  else if ("bulkread" in d) markRead([...picks]);
  else if ("bulkunread" in d) markUnread([...picks]);
  else if ("bulkdel" in d) remove([...picks]);
  else if ("clear" in d) { picks.clear(); render(); }
  else if (d.sel) {
    sel = +d.sel; peek = true;
    // Opening an email marks it read.
    const opened = mail.find(m => m.id === sel);
    if (opened.unread) {
      opened.unread = false; window.syncFlags?.([opened], "unread", false);
      undoFn = () => { opened.unread = true; window.syncFlags?.([opened], "unread", true); };
      undoLabel = "Marked read"; undoAt = Date.now();
    }
    if (view === "news") countNewsToday();
    render();
  }
  else if (d.read) markRead([+d.read]);
  else if (d.todaydone) toggleTodayTask(d.todaydone);
  else if ("todayfold" in d) { todayFolded = !todayFolded; try { localStorage.setItem("inbox-today-fold", todayFolded ? "1" : "0"); } catch {} render(); }
  else if (d.todaynews) {
    view = "news"; cat = null; draft = null; picks.clear(); sel = +d.todaynews; peek = true;
    const opened = mail.find(m => m.id === sel);
    if (opened?.unread) { opened.unread = false; window.syncFlags?.([opened], "unread", false); }
    countNewsToday(); render();
  }
  else if (d.unread) markUnread([+d.unread]);
  else if (d.rank) rerank(+d.rank, +d.score);
  else if ("cat" in d) { cat = d.cat || null; view = "mail"; draft = null; picks.clear(); render(); }
  else if ("readlater" in d) markRead(shown().filter(m => m.unread && m.score < WAIT_BELOW).map(m => m.id));
  else if ("close" in d) { peek = false; render(); }
  else if ("undo" in d) { undoFn?.(); undoFn = null; render(); }
  else if ("reset" in d) { mail = fresh(); undoFn = null; cat = "Unread"; picks.clear(); render(); }
});
// Sending a reply marks the email read but keeps you on it; it leaves Unread once you click away.
document.addEventListener("submit", e => {
  e.preventDefault();
  const m = mail.find(x => x.id === sel);
  if (!m) return;
  m.draft = "";
  if (m.unread) { m.unread = false; window.syncFlags?.([m], "unread", false); }
  render();
});
document.addEventListener("input", e => {
  if (e.target.id !== "skytime") return;
  const h = +e.target.value; window.skyPreview?.(h); $("skytimeout").textContent = hourLabel(h);
});
// A mouse's side buttons go back and forward too.
document.addEventListener("mouseup", e => { if (e.button === 3 || e.button === 4) { e.preventDefault(); goHistory(e.button === 3 ? -1 : 1); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("orig").hidden) return closeOriginal();
  if (e.target.id === "search" && e.key === "Enter") { e.preventDefault(); clearTimeout(searchTimer); searchAll(search.trim()); return; }
  if (e.target.id === "search" && e.key === "Escape") { search = ""; searchHits = null; searching = ""; clearTimeout(searchTimer); render(); return; }
  if (e.key === "/" && !e.target.matches("textarea, input, select")) { e.preventDefault(); $("search")?.focus(); return; }
  if (view === "calendar" && (e.metaKey || e.ctrlKey) && ["=", "+", "-", "0"].includes(e.key)) {
    e.preventDefault();
    return e.key === "0" ? calZoomBy(HOUR_DEFAULT / HOUR, null, true) : calZoomBy(e.key === "-" ? 1 / 1.5 : 1.5, null, true);
  }
  if ((e.metaKey || e.ctrlKey) && (e.key === "[" || e.key === "]") && !e.target.matches?.("textarea, input, select")) {
    e.preventDefault(); return goHistory(e.key === "[" ? -1 : 1);
  }
  if (e.key === "Escape" && composing) return closeComposer();
  if (e.key === "Escape" && draft) { draft = null; return render(); }
  if (e.target.id === "f-guest" && (e.key === "Enter" || e.key === ",")) { e.preventDefault(); return addGuest(); }
  if (e.target.matches("textarea, input, select") || !$("orig").hidden) return;
  if (e.key === "c") return toggleView();
  if (e.key === "n") { e.preventDefault(); return openComposer(); }
  if (view !== "mail" && view !== "news" && !"1234".includes(e.key)) return;
  const list = shown(), at = list.findIndex(m => m.id === sel);
  if (e.key === "j" && at < list.length - 1) { sel = list[at + 1].id; render(); }
  else if (e.key === "k" && at > 0) { sel = list[at - 1].id; render(); }
  else if (e.key === "e" && sel) mail.find(m => m.id === sel).unread ? markRead([sel]) : markUnread([sel]);
  else if (e.key === "s" && sel) toggleStar(sel);
  else if (e.key === "x" && sel) togglePick(sel, e.shiftKey);
  else if ("1234".includes(e.key)) { acct = ACCOUNTS[+e.key - 1][0]; picks.clear(); render(); }
});
/* Drag the seam to size the reading pane; double-click it to go back to the default. The width is remembered here. */
const READER_MIN = 380, LIST_MIN = 340, READER_DEFAULT = 560;
let readerW = READER_DEFAULT, seamDrag = null;
try { readerW = +localStorage.getItem("inbox-reader-w") || READER_DEFAULT; } catch {}
function setReaderW(w, save) {
  const panes = $("panes");
  if (!panes) return;
  const max = Math.max(READER_MIN, panes.clientWidth - LIST_MIN);
  readerW = Math.round(Math.min(max, Math.max(READER_MIN, w)));
  $("glass").style.setProperty("--reader-w", readerW + "px");
  if (save) { try { localStorage.setItem("inbox-reader-w", readerW); } catch {} }
  window.dispatchEvent(new Event("readerresize"));
}
document.addEventListener("pointermove", e => {
  const seam = seamDrag?.seam || e.target.closest?.(".divider");
  if (seam) seam.style.setProperty("--handle-y", Math.max(22, Math.min(seam.clientHeight - 22, e.clientY - seam.getBoundingClientRect().top)) + "px");
  if (seamDrag) setReaderW(seamDrag.right - e.clientX, false);
});
document.addEventListener("pointerdown", e => {
  const seam = e.target.closest?.(".divider");
  if (!seam || e.button) return;
  e.preventDefault();
  seamDrag = {seam, right: $("panes").getBoundingClientRect().right};
  seam.classList.add("is-dragging");
  document.body.classList.add("is-column-resizing");
});
document.addEventListener("pointerup", () => {
  if (!seamDrag) return;
  seamDrag.seam.classList.remove("is-dragging");
  document.body.classList.remove("is-column-resizing");
  seamDrag = null;
  setReaderW(readerW, true);
});
document.addEventListener("dblclick", e => { if (e.target.closest?.(".divider")) setReaderW(READER_DEFAULT, true); });
document.addEventListener("keydown", e => {
  if (!e.target.closest?.(".divider")) return;
  if (e.key === "ArrowLeft") setReaderW(readerW + 32, true);
  if (e.key === "ArrowRight") setReaderW(readerW - 32, true);
});
window.addEventListener("resize", () => setReaderW(readerW, false));
render();
setReaderW(readerW, false);
</script>
